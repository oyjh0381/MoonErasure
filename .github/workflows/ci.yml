name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.23
      - name: Toolchain
        run: moon version --all
      - name: Windows OCaml path compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./tools/windows/build-shim.ps1
          $shim = Join-Path $env:GITHUB_WORKSPACE '_build/windows-path-shims'
          "MOONC_OVERRIDE=$shim/moonc.exe" >> $env:GITHUB_ENV
          "MOONFMT_OVERRIDE=$shim/moonfmt.exe" >> $env:GITHUB_ENV
          "MOONINFO_OVERRIDE=$shim/mooninfo.exe" >> $env:GITHUB_ENV
          $env:MOONC_OVERRIDE = "$shim/moonc.exe"
          Push-Location (Join-Path $env:USERPROFILE '.moon/lib/core')
          moon bundle --all --warn-list -a
          Pop-Location
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/reference/go.mod
          cache-dependency-path: tools/reference/go.sum
      - name: Regenerate pinned reference vectors
        shell: bash
        run: |
          mkdir -p testdata
          (cd tools/reference && go run . > ../../testdata/reedsolomon-v1.14.2.json)
          python tools/generate_reference_tests.py
          moon fmt
          git diff --exit-code
      - name: Minimum compiler version
        run: python tools/verify_toolchain.py
      - name: Run extension scenario
        run: moon run examples/placement --target wasm-gc --deny-warn
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Build all backends
        run: moon build --target all --deny-warn
      - name: Test all backends
        run: moon test --target all --deny-warn
      - name: Run application examples
        run: |
          moon run cmd/main --target wasm-gc
          moon run examples/transfer --target wasm-gc
          moon run examples/scrub --target wasm-gc
          moon run examples/range --target wasm-gc
          moon run examples/stream --target wasm-gc
          moon run examples/maintenance --target wasm-gc
          moon run examples/degraded_read --target wasm-gc
          moon run examples/incremental_update --target wasm-gc
          moon run examples/selective_repair --target wasm-gc
          moon run examples/range_update --target wasm-gc
      - name: Verify formatting and public interfaces
        run: |
          moon fmt
          moon info
          git diff --exit-code
