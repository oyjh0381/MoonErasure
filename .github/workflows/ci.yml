name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/reference/go.mod
          cache-dependency-path: tools/reference/go.sum
      - name: Regenerate pinned reference vectors
        run: |
          mkdir -p testdata
          (cd tools/reference && go run . > ../../testdata/reedsolomon-v1.14.2.json)
          python tools/generate_reference_tests.py
          moon fmt
          git diff --exit-code
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Build all backends
        run: moon build --target all --deny-warn
      - name: Test all backends
        run: moon test --target all --deny-warn
      - name: Run application examples
        run: |
          moon run cmd/main --target wasm-gc
          moon run examples/transfer --target wasm-gc
          moon run examples/scrub --target wasm-gc
          moon run examples/range --target wasm-gc
          moon run examples/stream --target wasm-gc
          moon run examples/maintenance --target wasm-gc
          moon run examples/degraded_read --target wasm-gc
          moon run examples/incremental_update --target wasm-gc
          moon run examples/selective_repair --target wasm-gc
      - name: Verify formatting and public interfaces
        run: |
          moon fmt
          moon info
          git diff --exit-code
